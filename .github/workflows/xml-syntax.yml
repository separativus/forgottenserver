# Upstream workflow, kept for parity with master. The 7.60 branch has its own
# pipeline (ci-760.yml) on self-hosted runners, so the trigger is pinned to the
# upstream-tracking branches instead of firing on every branch and pull request.
name: XML syntax check

on:
  pull_request:
    branches:
      - master
      - v*

    paths:
      - data/**.xml
  push:
    branches:
      - master
    paths:
      - data/**.xml

jobs:
  xmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt update -q && sudo apt install -yq libxml2-utils

      - name: Test XML syntax
        run: find data/ -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout

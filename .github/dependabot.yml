# Dependabot reads this file from the default branch, which is 7.60 — the
# branch this fork actually develops and the engine
# separativus/tibiafun-tfs-migration ships. master stays a byte-identical
# mirror of otland/forgottenserver so it can always be fast-forwarded.
#
# Weekly, Monday morning, Berlin time, matching the other repositories on the
# migration host. vcpkg has no dependabot ecosystem, and no build of this
# branch goes through vcpkg (ci-760.yml and the migration repo compile against
# debian packages), so nothing moves vcpkg.json's baseline.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin

  - package-ecosystem: docker
    # The Dockerfile at the repository root. The builder image in ci-760.yml
    # is an inline heredoc, not a file, so dependabot cannot see it — keep its
    # bookworm base in step with Dockerfiles/server in the migration repo.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
